name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }} packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            build_command: npm run build:win:all
            artifact_name: release-windows
            artifact_paths: |
              dist/*.exe
              dist/*.zip
              dist/*.yml
              dist/*.blockmap
          - os: macos-latest
            label: macOS
            build_command: npm run build:mac
            artifact_name: release-macos
            artifact_paths: |
              dist/*.dmg
              dist/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        shell: bash
        run: |
          python -m venv backend/.venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            VENV_PY="backend/.venv/Scripts/python.exe"
          else
            VENV_PY="backend/.venv/bin/python"
          fi
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install -r backend/requirements.txt

      - name: Build packages
        run: ${{ matrix.build_command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DataDjinn ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist-release/*.exe
            dist-release/*.zip
            dist-release/*.dmg
            dist-release/*.yml
            dist-release/*.blockmap
